# GAPHS membership site: one web service with its own disk. Nothing here refers to any other site.
services:
  - type: web
    name: gaphs-membership
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120
    disk:
      name: gaphs-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: vp@gaphs.org
      - key: ADMIN_PASSWORD
        sync: false
