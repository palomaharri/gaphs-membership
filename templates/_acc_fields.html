<div class="field"><label for="acc_years">How long has your company been trading?</label><input id="acc_years" name="acc_years" type="text" value="{{ form.get('acc_years', '') }}" placeholder="For example: 6 years, since 2019"></div>
<div class="field"><label for="acc_projects">Roughly how many staging projects have you completed?</label><input id="acc_projects" name="acc_projects" type="text" value="{{ form.get('acc_projects', '') }}"></div>
<div class="field"><label for="acc_portfolio">Portfolio: links to at least three projects</label><textarea id="acc_portfolio" name="acc_portfolio" rows="5" placeholder="One link per line">{{ form.get('acc_portfolio', '') }}</textarea><div class="hint">Links only, please, not image files: pages on your website, or shared folders (Google Drive, Dropbox). Before and after photos are ideal.</div></div>
<div class="field"><label for="acc_certs">Course certificates: links</label><textarea id="acc_certs" name="acc_certs" rows="3" placeholder="One link per line">{{ form.get('acc_certs', '') }}</textarea><div class="hint">A shared link to each home staging course certificate you hold (Google Drive, Dropbox or similar).</div></div>
<div class="field"><label for="acc_notes">Anything else you would like us to know (optional)</label><textarea id="acc_notes" name="acc_notes" rows="3">{{ form.get('acc_notes', '') }}</textarea><div class="hint">Awards, press, insurance, team size, the areas you cover.</div></div>
