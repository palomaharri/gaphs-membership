{% extends 'base.html' %}
{% block title %}Reset password · {% endblock %}
{% block body %}
<div class="page"><div class="narrow" style="max-width:520px">
  <h1>Reset your password</h1>
  <p class="lead" style="margin-top:12px">Enter your email and we will send you a link.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autofocus></div>
    <button class="btn" type="submit">Send the link</button>
  </form>
</div></div>
{% endblock %}
