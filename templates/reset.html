{% extends 'base.html' %}
{% block title %}New password · {% endblock %}
{% block body %}
<div class="page"><div class="narrow" style="max-width:520px">
  <h1>Choose a new password</h1>
  <form method="post" style="margin-top:28px">
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <div class="field"><label for="password">New password</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div>
    <div class="field"><label for="password2">Repeat it</label><input id="password2" name="password2" type="password" minlength="8" autocomplete="new-password" required></div>
    <button class="btn" type="submit">Save password</button>
  </form>
</div></div>
{% endblock %}
